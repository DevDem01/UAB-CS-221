<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A responsive gallery of scenic photographs.">
    <title>Scenic Photo Gallery | d0529s</title>
    <link rel="stylesheet" href="hw8.d0529s.css">
</head>
<body>
    <header class="site-header">
        <h1>Scenic Photo Gallery</h1>
        <p>A few favorite views from the great outdoors</p>
    </header>

    <main>
        <section class="gallery" aria-label="Scenic photographs">
            <div class="gallery-item photo-beach no-zoom"
                 role="img" aria-label="Sunlit beach beside clear blue water"
                 data-caption="A quiet day by the sea"></div>
            <div class="gallery-item photo-lake"
                 role="img" aria-label="Mountain lake beneath a cloudy sky"
                 data-caption="Still waters in the mountains"></div>
            <div class="gallery-item photo-sunset"
                 role="img" aria-label="Warm sunset over a green landscape"
                 data-caption="The last light of day"></div>
            <div class="gallery-item photo-wilderness"
                 role="img" aria-label="Open wilderness framed by distant mountains"
                 data-caption="Into the open wilderness"></div>
            <div class="gallery-item photo-waves"
                 role="img" aria-label="Ocean waves rolling toward shore"
                 data-caption="Waves along the coast"></div>
            <div class="gallery-item photo-alpine"
                 role="img" aria-label="Alpine peaks reflected in a mountain lake"
                 data-caption="A reflection in the alpine air"></div>
        </section>
    </main>

    <footer>
        <p>Photographs provided by Unsplash.</p>
    </footer>
</body>
</html>
