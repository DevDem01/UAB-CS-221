<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock,Paper,Scissors Game</title>
    <link rel="stylesheet" href="d0529s.lab.css">
    <script src="d0529s.lab8.js" defer></script>
</head>
<body>
    <main>
    <div class="game-container">
    <h1>Rock, Paper, Scissors Game</h1>
    <p>Please select a choice</p>
    <div class="choice">
        <button class="choice-rock" data-choice="rock">
           🪨 Rock
        </button>
        <button class="choice-paper" data-choice="paper">
            📄Paper
        </button>
        <button class="choice-scissors" data-choice="scissors">
           ✂️ Scissors
        </button>
    </div>
      <div id="result" role="status" aria-live="polite">
            Make your first move!
        </div> 
    </div> 
</main>  
</body>
</html>
